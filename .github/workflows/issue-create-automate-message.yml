name: Auto Comment on Issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to comment on
        required: true
        type: number

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add Comment to Issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN }}
          script: |
            const issueNumber = context.issue?.number
              ?? Number(context.payload.inputs?.issue_number);

            if (!issueNumber) {
              core.setFailed("An issue number is required.");
              return;
            }

            const commentBody = `### Thank you for raising this issue!
            We'll review it as soon as possible. We truly appreciate your contributions! ✨

            > Meanwhile make sure you've visited the README.md, CONTRIBUTING.md, and CODE_OF_CONDUCT.md before creating a PR for this. Also, please do NOT create a PR until this issue has been assigned to you. 😊`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });

            console.log("Issue comment added successfully.");
