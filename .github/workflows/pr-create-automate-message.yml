name: PR Create Automate Message

on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to comment on
        required: true
        type: number

permissions:
  contents: read

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN }}
          script: |
            const issueNumber = context.payload.pull_request?.number
              ?? Number(context.payload.inputs?.pr_number);

            if (!issueNumber) {
              core.setFailed("A pull request number is required.");
              return;
            }

            github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Namaste! 🙏 Thanks for submitting this PR and sharing your awesome *jugaad* with us! We'll review your code shortly. Please make sure your hacks are solid, all CI checks are passing, and it follows our contribution guidelines. May your code compile on the first try! 🚀"
            })
